# Netlify — 정적 프론트엔드(Vite) 호스팅.
# PPT 고품질 변환은 사용자가 로컬에서 실행하는 Docker 컨테이너(dilly97/float-pptx)가
# 담당하며, 프론트가 http://localhost:8321 을 직접 호출한다(프록시 불필요).
# 다른 백엔드(예: 클라우드)를 쓰려면 아래 VITE_PPTX_BACKEND_URL 을 지정하거나
# 런타임에 localStorage('pptx-backend-url')로 설정.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # VITE_PPTX_BACKEND_URL = "https://your-backend.example.com"  # 클라우드 백엔드 사용 시

# PWA 매니페스트 MIME 교정(기본 octet-stream → 규격 타입)
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# 서비스워커는 항상 최신 확인(stale SW 고착 방지)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# index.html은 항상 재검증 — 배포 후 새 해시 자산을 참조하게. stale HTML이 옛 청크를 요청해
# SPA 폴백(text/html)으로 받으면 "Failed to fetch dynamically imported module" MIME 오류 발생.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# 해시 자산은 불변(장기 캐시) — 파일명에 해시가 있어 안전
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 존재하지 않는 자산은 깔끔히 404 — SPA 폴백이 index.html(text/html)로 가로채 모듈 MIME 오류 내는 것 방지
[[redirects]]
  from = "/assets/*"
  status = 404

# SPA: 나머지 경로를 index.html로 (클라이언트 라우팅 대비)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
